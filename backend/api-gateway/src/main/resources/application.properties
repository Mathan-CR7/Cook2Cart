spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Gateway HTTP Client timeouts (prevent gateway timeouts on slow AI processing requests)
spring.cloud.gateway.httpclient.response-timeout=300s
spring.cloud.gateway.httpclient.connect-timeout=10000


# File upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.codec.max-in-memory-size=100MB



# User Service Route
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**,/users/**,/address/**,/oauth2/**,/login/**

# Video Service Route (Docker has ffmpeg/yt-dlp installed and exposes 8086 -> 8081)
spring.cloud.gateway.server.webflux.routes[1].id=video-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8086
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/video/**,/api/videos/**

# AI Service Route
spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ai/**,/api/recipes/**

# Cart Service Route
spring.cloud.gateway.server.webflux.routes[3].id=cart-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CART-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/cart/**,/api/carts/**

# Product Service Route
spring.cloud.gateway.server.webflux.routes[4].id=product-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/products/**

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: cook2cart-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: cook2cart-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms128m -Xmx256m"

  redis:
    image: redis:7
    container_name: cook2cart-redis
    ports:
      - "6379:6379"
    volumes:
      - cook2cart_redis_data:/data

  tor-proxy:
    image: dperson/torproxy
    container_name: cook2cart-tor-proxy
    ports:
      - "8118:8118"
      - "9050:9050"

  video-service:
    build:
      context: ./backend/video-service
      dockerfile: Dockerfile
    container_name: cook2cart-video-service-8086
    depends_on:
      - kafka
      - elasticsearch
      - redis
      - tor-proxy
    ports:
      - "8086:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      VIDEO_OUTPUT_DIR: /tmp/cook2cart/videos
      AUDIO_OUTPUT_DIR: /tmp/cook2cart/audio
      FFMPEG_PATH: ffmpeg
      YT_DLP_PATH: yt-dlp
      HTTP_PROXY: http://tor-proxy:8118
      HTTPS_PROXY: http://tor-proxy:8118
    volumes:
      - ./data:/tmp/cook2cart

  python-transcript-service:
    build:
      context: ./backend/python-transcript-service
      dockerfile: Dockerfile
    container_name: cook2cart-python-transcript-service-8089
    depends_on:
      - tor-proxy
    ports:
      - "8089:8089"
    environment:
      YOUTUBE_PROXY: http://tor-proxy:8118

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: cook2cart-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - cook2cart_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  cook2cart_es_data:
  cook2cart_redis_data:
